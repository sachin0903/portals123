[project]
name = "graphene-api"
version = "0.0.0"
description = "Graphene Platform API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.136",
  "litestar>=2.15",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "workos>=7.0",
  "pyjwt[crypto]>=2.14",
  "python-multipart>=0.0.9",  # FastAPI file uploads (branding assets)
  "openpyxl>=3.1",            # IFSL fund look-through workbook imports
  "boto3>=1.35",              # S3-compatible object storage for branding assets
  "duckdb>=1.5.4",            # per-tenant DuckLake access (app/lake, docs/datalake.md)
  "pyarrow>=17",              # lake results as Arrow tables
  "pandas>=2.2",              # lake results as DataFrames (.df()) + register() inputs
  # REQUIRED BY DUCKDB, NOT BY US -- nothing in this codebase imports pytz, so it looks unused and
  # is not. DuckDB's Python layer needs it to turn a `TIMESTAMP WITH TIME ZONE` into a `datetime`,
  # and without it EVERY `fetchall()`/`fetchone()` over a relation carrying one raises
  # `Invalid Input Error: Required module 'pytz' failed to import`. Plain TIMESTAMP and DATE are
  # unaffected, which is why it surfaced as one broken console tab rather than as a broken lake.
  #
  # It used to arrive transitively: pandas <=2.x depended on pytz. The lock resolved pandas 3.0.5,
  # which DROPPED that dependency, so it vanished with an upgrade that named nothing about
  # timezones. Declared explicitly here so the next resolver change cannot take it away again.
  "pytz>=2024.1",
  "jinja2>=3.1",              # document render: sandboxed template engine
  "markupsafe>=2.1",          # jinja autoescape (Markup)
  "weasyprint>=70",           # document render: HTML/CSS → PDF (default engine; needs native libs)
  # Already here transitively (weasyprint needs it); declared because app/shell_images.py imports
  # it directly to downscale uploaded logos — the pytz lesson above, applied before it bites.
  # >=13: 12.x carries the JPEG/GIF/TIFF decoder CVEs (CVE-2026-112397..112404), and the branding
  # upload now decodes uploaded GIF and TIFF.
  "pillow>=13",
  # HEIC/HEIF reader for Pillow (app/imaging.py): a firm's logo upload from an iPhone. The
  # decode-only "light" build of pillow-heif — no encoder, so no x265 in the wheel.
  "pi-heif>=1.4",
  # SVG -> PNG for email (app/imaging.py): a mail client cannot draw an SVG logo, so the send path
  # draws its PNG copy. Drives the Cairo library WeasyPrint already needs in the images (Dockerfile).
  # >=2.7: external files and URLs are refused by default (CVE-2023-27586).
  "cairosvg>=2.7.1",
  "playwright>=1.48",         # document render: opt-in Chromium engine ('chromium' renderer)
  "anthropic>=0.120",         # flows AI gates (app/flows/ai.py): classify + draft_message
  "css-inline>=0.14",         # email render: fold <style>/CSS into inline style attrs (client-safe)
  "nh3>=0.2",                 # content CMS: sanitise GrapesJS HTML before it reaches the client portal
  "olefile>=0.47",            # legacy .doc/.xls/.ppt attachment type sniffing (app/storage.py)
  "segno>=1.6.6",             # identity phone handoff: QR code of the one-time link
  # Workspace packages this app imports. These were once left undeclared, on the reasoning that
  # a uv workspace member is in the shared venv anyway and declaring them would force a lock
  # that migrated `interlace` off the editable sibling checkout. Both halves of that have since
  # expired: services/* build against the published `interlaced`, and relying on the implicit
  # install stopped working — `morgan_lloyd` fell out of the venv and `api:typecheck` could not
  # resolve it. Declared properly, so the dependency is a fact rather than a side effect.
  "api-log",                  # pkgs/api-log — the emit side of audit.api_log
  "baton",                    # pkgs/baton — the durable action runtime (docs/baton.md)
  "intelliflo",               # pkgs/intelliflo — Intelliflo Office adviser directory (SEI↔IO map)
  "morgan-lloyd",             # pkgs/morgan-lloyd — Dynamics 365 CRM (contacts, contributions)
  "sei",                      # pkgs/sei — SWP cash receipts (payment expectations)
  "seccl",                    # pkgs/seccl — payload models AND the API client (moved from
                              # services/seccl so this app depends on a package, not a service)
  # Traces. The HTTP exporter only; psycopg is deliberately not instrumented (SQLAlchemy
  # already records each statement, and both layers would double-count every query).
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.0",
  "types-openpyxl>=3.1",
  # pkgs/book-sink is a DEV dependency only, and the distinction matters: the API does not
  # write the book through it (the provider daemons do, as book_writer). It is here because the
  # migrated-Postgres harness lives in this suite, and a merge is a statement about Postgres
  # behaviour — ON CONFLICT, a pre-allocated identity, RLS, book_writer's own grants — that only
  # a real database can settle. tests/test_no_sink_import.py keeps the runtime side honest.
  "book-sink",
]

# This is an application, not a distributable package — uv should not try to build it.
[tool.uv]
package = false

[tool.uv.sources]
api-log = { workspace = true }
baton = { workspace = true }
book-sink = { workspace = true }
intelliflo = { workspace = true }
morgan-lloyd = { workspace = true }
seccl = { workspace = true }
sei = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]      # asserts are fine in tests
"migrations/*" = ["E501"] # generated migration lines can be long
"app/email/chrome_generated.py" = ["E501"] # generated chrome is one long line per shape
"scripts/*" = ["S608", "E501"]  # SQL from trusted local identifiers; long inline seed-data lines

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: Depends()/Security() in arg defaults is correct.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.File"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# boto3/duckdb/pyarrow/pandas/olefile/pi_heif/cairosvg ship no (complete) type stubs; we keep them behind
# Any-typed helpers (app/storage.py, app/object_store.py, app/lake/).
[[tool.mypy.overrides]]
module = [
  "boto3",
  "boto3.*",
  "botocore.*",
  "duckdb",
  "duckdb.*",
  "pyarrow",
  "pyarrow.*",
  "pandas",
  "pandas.*",
  "olefile",
  "pi_heif",
  "cairosvg",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "pkgs_ui_pin: pins Python behavior against PORTAL source — pkgs/ui (block-contract.json, flow-contract.json, or a TS module read directly) or a portal app's own TypeScript. Named for the first because that was the only case when it was written; the reason is the same for both, which is that the API container ships without either, so these tests are the only thing keeping a rule written in two languages honest. Selected by moon's api:test-contracts task.",
  "bench: a load test. Excluded from api:test, and therefore from pull-request CI. Run with pytest -m bench.",
]
