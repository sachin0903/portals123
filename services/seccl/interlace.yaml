# interlace v2 project config. Unset keys use the defaults:
#   state_path: .interlace/state.db   (SQLite control plane)
#   stream_path: .interlace/streams.db (durable stream log)
#
# Warehouse: a DuckLake catalogue hosted in the `datalakes` Postgres database
# (metadata schema `seccl`), with parquet in the core bucket's datalake zone
# (s3://platforms/datalake/seccl/ — docs/storage.md, docs/datalake.md). The
# ${VARS} interpolate from the environment; the moon tasks load them from .env
# (see .env.example). Unset vars leave the literal ${...} in place — interlace
# then fails loudly on connect rather than writing somewhere surprising.
name: seccl
model_paths:
  - models

# State and streams are env-driven so a second env (`.env.production`, run with
# `uv run --env-file .env.production interlace …`) gets its own control plane.
# The catalogue schema is NOT env-driven — it is the literal `seccl` below.
state_path: '${SECCL_STATE_PATH}'
stream_path: '${SECCL_STREAM_PATH}'

# The warehouse DSN and the object-store credential are SHARED, not per-provider: every provider
# writes parquet into the same core bucket and catalogues it in the same `datalakes` Postgres. So
# they interpolate the CANONICAL names (`DATALAKE_WRITER_DSN`, `S3_*`) that the API and every other
# service already set — one value, not one per provider.
#
# Worth doing because of how the alternative fails, not because it is untidy: a wrong endpoint does
# not raise. The parquet lands where the reader never looks, so it reads as "the catalogue is empty",
# which is indistinguishable from "this provider has no data here".
#
# Only the parquet PREFIX and the metadata schema are this provider's own, and both are literals
# below rather than variables: they are facts about this file, not about the deployment.
database: 'ducklake:postgres:${DATALAKE_WRITER_DSN}'
data_path: 's3://${S3_CORE_BUCKET}/datalake/seccl/'
# THE LITERAL, since both `provider_schema()` implementations hard-derive `seccl` and neither
# honours a variable. It was `${SECCL_METADATA_SCHEMA}`, and an earlier production env set that to `seccl_prod` —
# so a production run wrote its catalogue into a schema no reader looks in, and `app/lake/core.py`
# and `book_sink/register.py` both attached `seccl` and found it empty. That is the exact
# reads-as-"this firm has no data with this custodian" failure the Morgan Lloyd `{"morgan-lloyd":
# "ml"}` map was deleted to prevent, reachable for Seccl instead.
#
# A production run is isolated by its own `DATALAKE_WRITER_DSN` — a different DATABASE — not by a
# different schema in the shared one, which is what the readers can actually follow.
metadata_schema: seccl
# The catalogue is ATTACHed as `warehouse`, not as the project name — the
# consumption layer is the `seccl` SCHEMA, and DuckDB cannot bind `seccl.clients`
# when `seccl` is both a catalog and a schema.
alias: warehouse
# The portals database, ATTACHed so the per-tenant staging models can DELIVER into it
# (`materialise: table`, target `book.inbound.{uid}__{entity}`). This is T0 federation: the SQL
# still runs in DuckDB, which writes through its postgres extension.
#
# It connects as `book_writer`, NOT as the API's app role and NOT as service_role. That credential
# reaches the merged relations and nothing else (migration 0062): a compromised daemon cannot read
# a client's identity documents or a firm's screening outcomes. BYPASSRLS is unavoidable for a
# writer that spans tenants and is stated plainly there rather than argued away.
attach:
  book: 'postgres:${BOOK_WRITER_DSN}'

secrets:
  core_s3:
    key_id: '${S3_ACCESS_KEY_ID}'
    secret: '${S3_SECRET_ACCESS_KEY}'
    endpoint: '${S3_ENDPOINT_HOST}' # host[:port], no scheme
    url_style: path
    use_ssl: false # local RustFS; flip when the endpoint is https
