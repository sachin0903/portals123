[project]
name = "seccl-sync"
version = "0.0.0"
description = "Seccl platform sync — webhook-driven ingestion + incremental extraction on interlace v2"
requires-python = ">=3.13"
dependencies = [
  # 2.0.0 renamed the interlace-owned materialisation to `virtual` and repurposed `table` for
  # EXTERNAL tables it delivers into but never drops — which is what lets the per-tenant merge
  # write the portals database directly. `adbc` is the postgres engine's driver (it ingests
  # Arrow via adbc_ingest); without the extra the engine raises at open.
  # 2.8.8 keeps a schema-qualified DuckLake create in that schema. Before it, a
  # parallel build could commit the table into `main`.
  "interlaced[service,adbc]>=2.8.8",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyarrow>=17",
  "tenacity>=8.5",
  "pyjwt[crypto]>=2.14",      # Seccl Private Key JWT (M2M) client assertions
  "boto3>=1.35",             # client documents -> core bucket (raw zone)
  "seccl",                   # pkgs/seccl — the API client and settings live there now, so the
                             # API can reach Seccl without depending on this service
  "fastapi>=0.136",
  "uvicorn[standard]>=0.32",
  # pkgs/api-log — `seccl_sync.client` records every outgoing Seccl call (audit.api_log).
  # Undeclared until now, which worked only from a checkout: the repo-root venv holds every
  # workspace member, so the import resolved locally while the service's own image — which syncs
  # this member alone — had no api_log at all and died during interlace's model discovery.
  "api-log",
  # pkgs/book-sink — the per-tenant filter/stage/merge models this project registers in
  # models/tenants.py. The write side of the pipeline lives there because all three providers
  # need the same one, and a second copy would drift from the merge policy in the migrations.
  "book-sink",
]

[tool.uv.sources]
api-log = { workspace = true }
book-sink = { workspace = true }
seccl = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seccl_sync"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # asserts + dummy credentials are fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: Depends()/Security() in arg defaults is correct.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# pyarrow and boto3 ship no type stubs.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "boto3", "boto3.*"]
ignore_missing_imports = true
