[project]
name = "sei-sync"
version = "0.0.0"
description = "SEI Wealth Platform sync — SFTP report ingestion + PGP decrypt + interlace v2 models"
requires-python = ">=3.13"
dependencies = [
  # 2.0.0 renamed the interlace-owned materialisation to `virtual` and repurposed `table` for
  # EXTERNAL tables it delivers into but never drops — which is what lets the per-tenant merge
  # write the portals database directly. `adbc` is the postgres engine's driver (it ingests
  # Arrow via adbc_ingest); without the extra the engine raises at open.
  # 2.8.8 keeps a schema-qualified DuckLake create in that schema. Before it, a
  # parallel build could commit the table into `main`.
  "interlaced[service,adbc]>=2.8.8",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyarrow>=17",
  "paramiko>=3.5",           # SEI delivers reports over SFTP (gws.ftp.seic.com)
  # PGPy 0.6.0 is dead on Python 3.13 — it imports `imghdr`, removed by PEP 594.
  # pgpy13 is the maintained 3.13 fork; verified against a real p04 .out.pgp drop.
  "pgpy13>=0.6.1rc1",
  "boto3>=1.35",             # graphene-core object store (S3-compatible)
  # pkgs/book-sink — a RUNTIME dependency, because `models/tenants.py` imports it at module load
  # and interlace discovers models by importing them. It sat in `dev` with a comment saying this
  # service does not import it at run time, which was true before the per-tenant chain landed:
  # a `--no-dev` install (what every Dockerfile does) then loses `models/tenants.py` entirely, and
  # an absent model is not an error — the daemon serves happily with no tenant models at all,
  # which reads as "no firm is enabled on SEI" rather than as a broken build.
  "book-sink",
  # pkgs/api-log — `sei_sync.api` records its outgoing SWP calls through it. Declared explicitly
  # rather than leaned on transitively through book-sink: this module is a direct importer.
  "api-log",
]

[project.scripts]
sei-sync = "sei_sync.cli:run"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "boto3-stubs[s3]>=1.35",
  "types-paramiko>=3.5",
]

[tool.uv.sources]
api-log = { workspace = true }
book-sink = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sei_sync"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # asserts + dummy credentials are fine in tests

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pgpy's OpenPGP cipher table trips cryptography's relocation warnings, and its
# own compression-preference notice fires when a test key is built. Neither is
# actionable; see the note in src/sei_sync/decrypt.py.
filterwarnings = [
  "ignore:.*has been moved to cryptography\\.hazmat.*",
  "ignore:Selected compression algorithm not in key preferences",
]

# Neither pyarrow nor pgpy13 ships type stubs.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "pgpy", "pgpy.*"]
ignore_missing_imports = true
