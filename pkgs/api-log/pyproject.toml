[project]
name = "api-log"
version = "0.1.0"
description = "The emit side of audit.api_log — the contract vendor clients record outgoing calls through."
requires-python = ">=3.13"
# `api_log` itself has NONE, deliberately (see the package docstring: no database, no settings,
# so an SDK stays usable from a script). These two are `api_log.retry`'s, a SUBMODULE — one
# retry policy for the three vendor clients, which all already depend on both. `import api_log`
# pulls in neither.
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_log"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # asserts + dummy credentials are the point of a test

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
