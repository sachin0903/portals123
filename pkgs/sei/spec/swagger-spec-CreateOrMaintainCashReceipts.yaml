        - destinationStatementText
        - originationStatementText
      properties:
        payerId:
          type: string
          example: "85274196"
          description: 'The Profile Id of existing Payer- Associated with the account and designated receipt method.The Entity, person or organization, and the associated Financial Institutions and Intermediaries associated with this Payerid are subject to AML Review for Firms subject to SPTC AML monitoring. Failure to pass AML Review results in the request going into Exception “Under Review”. Once SPTC reviews the Payer details they may pass the review which allows the cash movement to be marked Complete or they may fail the review and the cash movement must be cancelled Only Payerids which entities and Financial institutions that passed AML Review can be used.'
          maxLength: 9
        originationStatementText:
          type: string
          example: "Create CR Webservice"
          description: 'BACS Direct Debit and ACH Direct Payment Statement Payer text for additional information '
          maxLength: 65
        destinationStatementText:
          type: string
          example: "Create CR Webservice"
          description: 'BACS Direct Debit and ACH Direct Payment Destination Payer Text for additional information'
          maxLength: 65
        uniqueMandateReference:
          type: string
          example: "Create CR Webservice"
          description: 'Additional text for BACS Direct Debit and ACH Direct Payment Receipt - Optional'
          maxLength: 65
