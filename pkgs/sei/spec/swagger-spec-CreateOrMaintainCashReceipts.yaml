          maxLength: 100
        caseNumber:
          type: string
          example: "QC78457"
          description: 'Case Number is optional and its eligible for Memo Post , Ad –hoc and some scenario in recurring - Optional'
          maxLength: 50
        reasonCode:
          type: string
          example: "16"
          description: 'Reason Code is optional and its eligible for Memo Post , Ad –hoc and some scenario in recurring. Possible values[SEI-Transfer - Nostro Err = 84, SEI-System Issue = 10, SEI-Reebook Original Posted on Time = 15, SEI-Other = 13, SEI-Account Closure = 86, Firm-Rebook Original Posted on Time = 16, Firm-Other = 14, FIRM-RSKMGT = 83, FIRM-LATEAPP = 81, FIMR-FIRM REQUEST = 85, CA processing of an ADR Fee. Not reflective of the disbursement Process = 82] - Optional'
          maxLength: 9
        reasonCodeComments:
          type: string
          example: "Created for CR Webservice"
          description: 'Reason Code Comments is optional and its eligible for Memo Post , Ad –hoc and some scenario in recurring - Optional'
          maxLength: 60
        freetrackTxnNum:
