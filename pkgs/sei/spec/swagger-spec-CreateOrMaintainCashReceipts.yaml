servers:
  - url: https://extranettest.api.seic.com/api/v1/swp/currencyreceiptservices
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v3/oauthtoken
          scopes: {}
        password:
          tokenUrl: /api/v1/swp/oauthsecurity/access_token
          scopes: {}
  schemas:
    RelatedSecurityDetails:
      type: object
      description: 'Related Security Details is optional and its eligible for Memo Post , Ad –hoc and some scenario in recurring '
      properties:
        relatedSecurityIdentifier:
          type: string
          example: "5"
          description: 'Identifies security instruments (2=ISIN, 4= Ticker, 5=CUSIP, 11=SEDOL, 22=Firm_Asset_Id).'
          maxLength: 2
        relatedSecurity:
          type: string
          example: "741852M96"
          description: 'The security identifier code of an asset. It must be of the type specified in above relatedSecurityIdentifier.'
          maxLength: 30
    JsonCurrencySoaSuccessResponse:
      type: object
      properties:
        data:
          type: array
          description: Success Data
          items:
            $ref: '#/components/schemas/SuccessData'
      description: Response data object for create currency receipt.
    Monthly:
      type: object
      description: 'The monthly having scheduled recurring event which will occur monthly.'
      required:
        - dayType
        - interval
        - monthDayNum
        - monthDayType
        - monthlyOccurrence
      properties:
        interval:
          type: string
          example: "2"
          description: 'Indicates the number of months between occurrences.'
          maxLength: 2
        dayType:
          type: string
          example: "2"
          description: 'Indicator for calendar (1 = Day) or business (2 = Business) days'
          maxLength: 1
        monthDayNum:
          type: string
          example: "18"
          description: 'Used in conjunction with dayType, indicates the day of the month the Event is due. Valid values are 1 – 31. (eq. 10th business day or 25th day)'
          maxLength: 2
        resolveOption:
          type: string
          maxLength: 1
          default: "2"
          example: "1"
          description: |
             A user will be able to enter either "1" or "2", with 1 being prior and 2 being next. This will only function with the monthly option when using                daytype and monthdaynum parameters.
        monthDayType:
          type: string
          example: "1"
          description: 'Indicator for the day of the week (1 =Day, 2 = Business Day, 3 = Sunday, 4 = Monday, 5 = Tuesday, 6 = Wednesday, 7 = Thursday, 8 = Friday, 9 = Saturday).'
          maxLength: 1
        monthlyOccurrence:
          type: string
          example: "2"
          description: 'Indicator used in conjunction with monthDayType to determine which day of the month the Event is due (1 = first, 2 = second, 3 = third, 4 = fourth, 5 = last, 6 = second to last, 7 = third to last). (eq. second Thursday of the month) '
          maxLength: 1
    CurrencyReceiptRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          description: Data for create currency receipt
          items:
            $ref: '#/components/schemas/Data'
      description: Model data object for create currency receipt request.
    Once:
      type: object
      description: 'The once having Memo Post, One Time Schedule and ADHOC details . Firm buffers per Payment Methods can be set, which defines the latest time a cash movement can be initiated for processing today. Cash Receipt ACH Collections that are entered and approved before the Cash Agent cut-off, minus the Firm Payment Method buffer time, process today. Requests after the Firm Payment Method buffer are processed the next business day.'
      properties:
        dueDate:
          type: string
          example: "2017-07-28"
          description: 'The date by which scheduled activity must be completed by[YYYY/MM/DD]. '
          maxLength: 16
        beneficiaryValueDate:
          type: string
          example: "2017-08-28"
          description: 'The desired date for funds to be credited to the client account. For Cash receipts, this typically makes sense only for memo posts (e.g. if you wanted to back date a memo post date). If not specified, the date of the receipt will be the date the funds clear and are available to the client account. [YYYY/MM/DD].'
          maxLength: 16
    Attributes:
      type: object
      required:
        - accountNumber
        - portfolioId
        - receiptInstructions
      properties:
        accountNumber:
          type: string
          description: 'The account number for which cash receipt activity is generated.'
          example: "USB00001"
          maxLength: 17
        portfolioId:
          type: string
          description: 'SEI Portfolio Id of above account by which cash receipt is generated.'
          example: "12085274"
