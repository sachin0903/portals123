      description: 'The daily having scheduled recurring event which will occur daily.'
      required: 
        - dayType
        - interval
      properties:
        interval:
          type: string
          example: "1"
          description: 'Indicates the number of days between occurrences.'
          maxLength: 1
        dayType:
          type: string
          example: "2"
          description: 'Indicator for calendar (1 = Day) or business (2 = Business) days '
          maxLength: 1
    Recurring:
      type: object
      description: 'The recurring having scheduled recurring event which can occur daily, weekly or monthly. '
      required:
        - startDate
      properties:
        startDate:
          type: string
          example: "2017-01-01"
          description: 'Date Event will first occur, as supplied when created [YYYY/MM/DD]. '
