    ReceiptInstructions:
      type: object
      description: 'Receipt Instructions for the cash receipt input details.'
      required:
        - currencyCode
        - descriptionTypeCode
        - receiptAmount
        - receiptMethod
        - treatmentTypeCode
      properties:
        currencyCode:
          type: string
          example: "GBP"
          description: 'ISO Currency code for the cash receipt activity.'
          maxLength: 3
        receiptMethod:
          type: string
          example: "3"
          description: 'The code associated with payment method in cash receipt (ACH=1, Wire=2, CHECK=3, BACS=5, CHAPS via SWIFT = 6, SWIFT = 7)'
          maxLength: 1
        receiptType:
          type: string
          example: "2"
          description: 'Receipt Type – For BACS[Direct Debit =2 , Direct Credit = 1] For ACH[Direct Deposit = 1, Direct Payment = 2] - Optional'
          maxLength: 1
        officialCheck:
          type: string
          example: "true"
          description: 'Official Check indicator for the CHECK receipt method. [true/false] - Optional'
          maxLength: 1
        checkReceivedFlag:
          type: string
          example: "true"
          description: 'check Received Flag'
          maxLength: 1
        checkNumber:
          type: string
          example: "12345698"
          description: 'Check Number for the CHECK receipt method. Must be provided if Check Received is true - Optional'
          maxLength: 256
        descriptionTypeCode:
          type: string
          example: "20207"
          description: 'The description code associated with the portfolio Id. Describes the purpose of the transaction. The Description Code provided in the request are validated for restriction for the Transaction Type. If it is restricted, an exception message is returned.'
          maxLength: 9
        treatmentTypeCode:
          type: string
          example: "1451"
          description: 'The treatment code associated with the Description code. Determines the tax treatment for the amount involved in the transaction. The Treatment Codes provided in the request are validated for restriction for the Transaction Type and for the User Role.If it is restricted, an exception message is returned.'
          maxLength: 9
        treatmentCodeTaxYear:
          type: string
          description: 'One of the tax year configured for the account involved in the transaction. Must be provided for specific valid combinations of DC and TC. - Optional'
          maxLength: 9
        netFeesFlag:
          type: string
          description: 'This flag can be used to call the net fees service and is optional, it defaults to No for non ISA account and default to yes for ISA account. When set to yes, it will call the net fees service when the firm/PO is configured for it.  This is for adhoc or memo post only'
          maxLength: 3
        investCash:
          type: string
          example: "true"
          description: 'Invest cash indicator to invest received cash amount to buy assets.[true/false]'
        eligibleForInvestCashScheduler:
          type: string
          example: "true"
          description: 'Flag to enable the batch process to invest cash.[true/false] - Optional'
          maxLength: 1
        receiptAmountType:
          type: string
          example: "1"
          description: 'Receipt amount type can be “Gross Value = 1, Unknown = 4” - Optional'
          maxLength: 1
        receiptAmount:
          type: string
          example: "21.25"
          description: 'The receipt amount is received into the portfolio. And this can take decimal value. '
        isaContribution:
          type: string
          example: "100"
          description: 'ISA Contribution for ISA/JISA accounts. ISA Contribution can be provided only for ISA accounts and treatment codes which are configured for contribution amount - Optional'
          maxLength: 17
        externalReference:
          type: string
          example: "Create CR Webservice"
          description: 'External identifier associated with SEI activity - Optional'
          maxLength: 65
        additionalNotes:
          type: string
          example: "Notes"
          description: 'Additional Notes associated with Cash Reciept activity. It is send to AML Scan and if it failed the scan, the Cash Movement Activity goes into exception for "Under Review" and is assigned to the SPTC AML role for review. The Activity is resolved if the fields pass the review. - Optional'
          maxLength: 256
        txnSuppressionFor:
          type: string
          example: "4"
          description: 'Flag to determine if transactions should be suppressed. Valid values: 1 – No suppression 2 - Statements 3 - Both Statements and Contract Notes/Advices 4 - Contract Notes/Advices'
          maxLength: 1
        furtherCreditTo:
          type: string
          example: "Created CR Webservice"
          description: 'Further credit to associated with Cash Reciept activity.This is applicable only for ACH and WIRE. Subject to SPTC AML Review as Entities and Financial Institutions are. Any text failing AML Review results in the request going to Exception “Under Review”. See Payerid for handling - Optional'
        acatsFlag:
          type: string
          example: "true"
          description: 'Flag to enable the ACATS to currency receipt[true/false] - Optional'
        sendPreNote:
          type: string
          example: "false"
          description: 'Flag to enable the send prenote to create currency receipt[true/false] - Optional'
        acquisitionCost:
          type: string
          example: "100"
          description: 'Acquisition Cost is eligible when we choose one time schedule, selected currency should not be base currency and check received true - true'
          maxLength: 17
        acquisitionDate:
          type: string
          description: 'Acquisition Date is eligible when we choose one time schedule, selected currency should not be base currency and check received true - Optional'
          maxLength: 10
        acquisitionCostUnknownFlg:
          type: string
          example: "true"
          description: 'Acquisition Cost Unknown Flag should not be true with Acquisition Cost . [true/false] - Optional'
          maxLength: 1
        acquisitionDateUnknownFlg:
          type: string
          example: "true"
          description: 'Acquisition Date Unknown Flag should not true with Acquisition Date. [tru/false] - Optional'
          maxLength: 1
        byPassApprovalRequired:
          type: string
          example: "true"
          description: 'The bypass approval indicator flag. When set to true, it bypasses the initiated approval workflow. When set to false, it initiates the approval workflow[true/false] -Optional'
          maxLength: 1
        payerInfo:
          $ref: '#/components/schemas/PayerInfo'
        acquisitionCostOverrideFlg:
          type: string
        acquisitionDateOverrideFlg:
          type: string
          example: "false"
          description: 'acquisition Date Override Flg'
        feesAndCharges:
          type: array
          description: 'List of overridden fees'
          items:
            $ref: '#/components/schemas/FeeOverride'
        memoFlag:
          type: string
          example: "true"
        preventStreetSideMsg:
          type: string
        releaseInvestCashImmediately:
          type: string
          example: "true"
          description: 'release InvestCash Immediately'
        externalSystemTxnId:
          type: string
          example: "PayerCheck"
          description: 'Text string to capture External System Transaction Id - Optional'
          maxLength: 50
        feesAndChargesDetails:
          type: array
          description: List of fee details
          items:
            $ref: '#/components/schemas/feesAndChargesDetails'
    feesAndChargesDetails:
      type: object
      properties:
        feeTypeId:
          type: Integer
          format: int32
          example: 1234
          description: Code to identify the fee profile id.
        feeRuleId:
          type: string
          example: "FeeRule1"
          description: Code to identify the fee rule id.
          maxLength: 36
        originalFeeAmount:
          type: number
          format: bigdecimal
          example: 10.45
          description: The original amount of the fee calculated based on the fee rule.
        overrideFeeAmount:
          type: number
          format: bigdecimal
          example: 5.45
          description: The override amount for the fee. This is the amount that will be used to override original fee amount.
        isOverridden:
          type: Integer
          example: 1
          description: Flag to indicate whether the original fee amount is overridden by the override fee amount.
        feePercentage:
          type: number
          format: double
          example: 10.45
          description: The percentage of the fee if the fee is calculated based on percentage.
        vatFeeRuleId:
          type: string
          example: "VATFeeRule1"
          description: Code to identify the VAT fee rule id if there is any VAT associated with the fee.
          maxLength: 36
        notes:
          type: string
          example: "Fee notes"
          description: Notes associated with the fee.
          maxLength: 512
