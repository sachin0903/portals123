openapi: 3.0.0
info:
  version: PSI51
  title: Initiate the Creation of a Cash Receipt
  description: |
    API to initiate a cash receipt with receipt types of ACR (Anticipated Cash Receipt), Direct Payment (US only), Direct Debit (UK only), and memo post (US and UK).
    
    ## Revision History
    ***
    | Version | Name | Release | Date | Description |
    | ------- | -------- | -------- | ------- | ------- |
    | 1.0 | SEI Investments | PSI 27 |September, 2017 | Initial version |
    | 2.0 | SEI Investments| PSI 27 |October, 2017 | Clarified restrictions on ACRs and beneficiary value date |
    | 3.0 | SEI Investments |PSI 29|March, 2018 | Updated External System transaction ID |
    | 4.0 | SEI Investments |PSI 30|June, 2018| Enhancements to Create Currency Receipt for Description Code/ Treatment Code Restriction. |
    | 5.0 | SEI Investments | PSI 31 |August, 2018 | Added information for asynchronous invocation support |
    | 6.0 | SEI Investments | PSI 31 |August, 2018 | Added fees And Charges segment in create currency receipt WS. |
    | 7.0 | SEI Investments | PSI 31 |September,2018 | Added details on Financial Institutions Associated with Payer to AML, Cash Agent Cutoff & Firm Buffer by Payment Method and Approval By Payment Method |
    | 8.0 | SEI Investments | PSI 32 |December, 2018 | Nostro Derivation (Exception Messages). Related Asset validation (Warning Messages) |
    | 9.0 | SEI Investments | PSI 41 |Feburary, 2021 | Edit releatedSecurityIdentifier to take security type identifier code 26 instead of 22 |
    | 10.0 | SEI Investments | PSI44 |November, 2023 | Edit business exception to state new exception for memo function point |
    | 11.0 | SEI Investments | PSI46 |July, 2024 | Add New Net Fees Optional field to Cash Receipt Adhoc/Memo Post as well as relevent business exceptions |
    | 12.0 | SEI Investments | PSI47 | November, 2024 | Added new bookCost field, Document stndardization, Net fees updated to allow one time scheduled and recurring |
    | 13.0 | SEI Investments | PSI49 | June, 2025 | Added new cashPostingRefId1,cashPostingRefType1,cashPostingRefId3,cashPostingRefType3 fields, Document standardization |
    | 14.0 | SEI Investments | PSI51 | January, 2025 | Enable the ability to have resolve next/prior via cash receipt web service |
    | 15.0 | SEI Investments | PSI51 | March, 2026 | Add new attribute feesAndChargesDetails for create Currency Receipt API along with function point validation |
    | 16.0 | SEI Investments | PSI51 | April, 2026 | Added new business exceptions related to feesAndChargesDetails attribute for create Currency Receipt API |
    
    ## Service Summary
    ***
    This guide provides details for use of the Currency Receipt web service on the SEI Wealth Platform.  These are designed to initiate the Currency Recipet workflow on the platform. At this time, the services support memo post, ad hoc, one time schedule and recurring.  
    In addition, all payment methods are supported.  However, ACRs are only supported for recurring (including "recurrence of 1").
    
    &nbsp; 
    ## List of Operations / Methods
    ***
    * ### Create Currency Receipt
      This operation creates a new cash receipt request/workflow for an account and portfolio subject to all applicable configured Services and Approvals. This can be a memo post, ad hoc, one time scheduled or recurring receipt for both U.S. and U.K. receipt methods i.e. Check, ACH, BACS, Fed Wire, SWIFT or CHAPS.
    
      On successful service execution, the cash receipt activity will be created.  The web service response will return the cash receipt activity ID.  If applicable a corresponding invest cash activity will also be created. This service enables the creation of a recurring cash receipt into account from an established third-party payer.  Account, amount, frequency, payer and other details will be required.
    
    * ### Create Currency Receipt (Asynchronous)
        For the Asynchronous invocation, the Request URI is appended with Async. This is the only change to be made from synchronous request to an asynchronous request. Invoking an API in an asynchronous  mode allows for the processing to happen asynchronously and the client does not have to wait for the processing to complete. It also allows to client to invoke the API when the system is in Limited Availability mode. The requests are queued up and processed once the system comes out to Limited Availability mode.This is used for when the environment in LA mode and stores the request until out of LA mode.
    
    ## Service Usage
    ***
    * The service is not available during SWP system Limited Availability mode or, while the system is in "clone" mode during planned maintenance outages.
    * The service supports Asynchronous call.
    * A call is expected to be a single request / response. The service does not support bulk requests.
    * Any approvals configured for the cash receipt workflows can be by-passed by the caller or not.All regularly configured approvals occur on the workflow if approvals are not bypassed.
    * Fee overrides can be specified on the receipt.
     
    
    ## Service - Create Currency Receipt
    ***
    Creates cash receipt activity.  Types of activities that can be created include -
    
    * Recurring cash receipt for both U.S. and U.K. receipt methods.
    * Memo Post cash receipt for both U.S. and U.K. receipt methods.
    * Ad hoc cash receipt for both U.S. and U.K. receipt methods.
    * One time schedule for both U.S. and U.K. receipt methods.
     
    ## Usage and Business Impact
    ***
    The service allows the user to initiate a workflow to create currency receipts (adhoc or one time schedule or memo post  or recurring). All receipt types supports both US and UK receipt methods. These activities are used to record receipt of funds or collection into client account based on receipt/collection instructions provided by such client.
    
    &nbsp; 
    ## Variations From UI
    ***
    * For recurring cash receipt, the web service will support existing Payer recipients only.  A separate service is available to create a new Payer.
    * In Core Platform, investment compliance pop up messages can be overwritten by an entitled user by providing a note and it is not supported in Web Services.
    * The web service supports an option to bypass firm-configured approvals.
    * Approval by Receipt Method not supported in prior versions of the web service are now supported in PSI27 so this variation is no longer applicable.
    * Services managed by entitlement to a specific function point are not supported.
    ## Function Point
    ***
    
    * function point ID is 123 for cash receipt
    * function Point ID is 7368 to control when recomputation of overridden fees is allowed to be performed by the cash webservices.
    &nbsp;

    ## EndPoint URL
    ***
      * /api/v1/swp/currencyreceiptservices/createCurrencyReceipt
tags:
  - name: Currency Receipt
    description: Service allows initiation of Cash Receipts
