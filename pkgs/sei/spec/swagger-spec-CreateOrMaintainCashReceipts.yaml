          type: string
          example: "2"
          description: 'Value representing the number of recurrences of the event, after which the vent will stop, if the Event was set-up with a value for “End After ‘n’ Occurrences” - Optional'
          maxLength: 9
        endByDate:
          type: string
          example: "2018-12-31"
          description: 'Date recurring Event is scheduled to stop, if Event was set-up with an ending date specified for “End By” [YYYY/MM/DD]. - Optional'
          maxLength: 16
    Weekly:
