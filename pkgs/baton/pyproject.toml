[project]
name = "baton"
version = "0.1.0"
description = "Durable action runtime: actions compose actions; runs replay; leaves retry. Postgres-backed."
requires-python = ">=3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # asserts + dummy credentials are the point of a test
# The schema is a validated bare identifier (baton.ddl checks it), interpolated into every
# statement the way the repo's own migrations do; the SQL strings run long.
"src/baton/store/postgres.py" = ["S608", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
